<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff sign in - SJSU Mentor Match</title>
    <link rel="stylesheet" href="sjsu-theme.css">
    <link rel="stylesheet" href="mentor-system.css">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="/">🎓 SJSU Mentor Match</a>
            <nav class="site-nav" aria-label="Main">
                <a href="/">Home</a>
                <a href="/survey.html?role=student">Student survey</a>
                <a href="/survey.html?role=mentor">Mentor survey</a>
                <a href="/orientation.html">Orientation</a>
                <span id="staffNav" class="staff-nav"></span>
            </nav>
        </div>
    </header>

    <div class="container narrow" id="main" role="main" tabindex="-1">
        <div class="header">
            <h1>🔐 Staff sign in</h1>
            <p>For staff who review mentor matches</p>
        </div>

        <form id="loginForm" class="login-body">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <p class="form-error" role="alert" hidden></p>
            <button type="submit" class="submit-btn">Sign in</button>

            <p class="hint">Students and mentors don't need to sign in. <a href="/">Back to home</a></p>
        </form>
    </div>

    <script src="site.js"></script>
    <script src="login.js"></script>
</body>
</html>
