<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework - SJSU Mentor Match</title>
    <link rel="stylesheet" href="sjsu-theme.css">
    <link rel="stylesheet" href="mentor-system.css">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="console.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="./index.html">🎓 SJSU Mentor Match</a>
            <nav class="site-nav" aria-label="Main">
                <a href="./index.html">Home</a>
                <a href="/survey.html?role=student">Student survey</a>
                <a href="/survey.html?role=mentor">Mentor survey</a>
                <a href="/orientation.html">Orientation</a>
                <span id="staffNav" class="staff-nav"></span>
            </nav>
        </div>
    </header>
    <nav class="console-tabs" id="consoleTabs"></nav>

    <main class="wrap console-main" id="main" tabindex="-1">
        <section class="timeline" id="timeline" aria-label="Program timeline"></section>
        <section class="strip-kpis" id="stripKpis" aria-label="Program summary"></section>

        <section class="panel">
            <div class="panel-head">
                <div>
                    <div class="eyebrow">Mentee prework &amp; postwork</div>
                    <h2>Homework completion</h2>
                </div>
                <div class="toolbar">
                    <label class="muted" for="hwRule">Pass if they turned in</label>
                    <select id="hwRule">
                        <option value="1">all work due so far</option>
                        <option value="0.75">at least 75%</option>
                        <option value="0.5">at least 50%</option>
                    </select>
                    <div class="seg" role="group" aria-label="Filter" id="hwFilter">
                        <button type="button" aria-pressed="true" data-h="all">All</button>
                        <button type="button" aria-pressed="false" data-h="fail">Fail only</button>
                    </div>
                </div>
            </div>
            <p class="status-line" id="hwError" role="alert" hidden></p>
            <div id="hwBody"></div>
        </section>
    </main>

    <script src="site.js"></script>
    <script src="console.js"></script>
    <script src="homework.js"></script>
</body>
</html>
