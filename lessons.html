<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lessons and attendance - SJSU Mentor Match</title>
    <link rel="stylesheet" href="sjsu-theme.css">
    <link rel="stylesheet" href="mentor-system.css">
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="console.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="brand" href="./index.html">🎓 SJSU Mentor Match</a>
            <nav class="site-nav" aria-label="Main">
                <a href="./index.html">Home</a>
                <a href="/survey.html?role=student">Student survey</a>
                <a href="/survey.html?role=mentor">Mentor survey</a>
                <a href="/orientation.html">Orientation</a>
                <span id="staffNav" class="staff-nav"></span>
            </nav>
        </div>
    </header>
    <nav class="console-tabs" id="consoleTabs"></nav>

    <main class="wrap console-main" id="main" tabindex="-1">
        <section class="timeline" id="timeline" aria-label="Program timeline"></section>
        <section class="strip-kpis" id="stripKpis" aria-label="Program summary"></section>

        <section class="panel">
            <div class="panel-head">
                <div>
                    <div class="eyebrow" id="lessonRange">Who attended each lesson</div>
                    <h2>Lessons &amp; attendance</h2>
                </div>
                <div class="toolbar">
                    <span class="muted">Meets</span>
                    <div class="seg" role="group" aria-label="How often lessons meet" id="cadence">
                        <button type="button" aria-pressed="true" data-c="7">Every week</button>
                        <button type="button" aria-pressed="false" data-c="14">Every 2 weeks</button>
                    </div>
                    <span class="muted" id="lessonSummary"></span>
                </div>
            </div>
            <p class="status-line" id="lessonError" role="alert" hidden></p>
            <div class="lesson-grid">
                <div class="lesson-list" id="lessonList"></div>
                <div id="lessonDetail"></div>
            </div>
        </section>
    </main>

    <script src="site.js"></script>
    <script src="console.js"></script>
    <script src="lessons.js"></script>
</body>
</html>
